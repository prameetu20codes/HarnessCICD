service:
  name: dummy_svc_42
  identifier: dummy_svc_42
  orgIdentifier: default
  projectIdentifier: onboarding_test
  serviceDefinition:
    type: Kubernetes
    spec:
      manifests:
        - manifest:
            identifier: helm_chart
            type: HelmChart
            spec:
              store:
                type: Github
                spec:
                  connectorRef: account.prameetgit
                  gitFetchType: Branch
                  repoName: HarnessCICD
                  branch: main
                  folderPath: charts/dummy42
              subChartPath: ""
              valuesPaths:
                - charts/dummy42/values.yaml
              skipResourceVersioning: false
              enableDeclarativeRollback: false
              helmVersion: V3
              fetchHelmChartMetadata: false
      artifacts:
        primary:
          primaryArtifactRef: image
          sources:
            - identifier: image
              type: DockerRegistry
              spec:
                connectorRef: account.harnessImage
                imagePath: library/busybox
                tag: <+stage.variables.version>
                digest: ""